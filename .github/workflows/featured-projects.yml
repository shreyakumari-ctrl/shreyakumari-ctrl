name: Update Featured Projects

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get pinned repositories
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          username = os.environ["GITHUB_REPOSITORY_OWNER"]
          token = os.environ["GH_TOKEN"]

          query = """
          query($login: String!) {
            user(login: $login) {
              pinnedItems(first: 6, types: REPOSITORY) {
                nodes {
                  ... on Repository {
                    name
                    description
                    url
                    stargazerCount
                    forkCount
                    primaryLanguage {
                      name
                    }
                  }
                }
              }
            }
          }
          """

          payload = json.dumps({
              "query": query,
              "variables": {
                  "login": username
              }
          }).encode()

          request = urllib.request.Request(
              "https://api.github.com/graphql",
              data=payload,
              headers={
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json",
                  "User-Agent": "github-actions"
              }
          )

          with urllib.request.urlopen(request) as response:
              data = json.load(response)

          if "errors" in data:
              print(json.dumps(data["errors"], indent=2))
              raise SystemExit(1)

          user = data.get("data", {}).get("user")

          if not user:
              raise SystemExit("GitHub user not found.")

          repos = user.get("pinnedItems", {}).get("nodes", [])

          print(f"Found {len(repos)} pinned repositories.")

          for repo in repos:
              print("Pinned:", repo.get("name"))

          os.makedirs("profile", exist_ok=True)

          with open("profile/pinned-projects.json", "w") as file:
              json.dump(repos, file, indent=2)

          PY

      - name: Generate Featured Projects SVG
        run: |
          python - <<'PY'
          import json
          import html

          with open("profile/pinned-projects.json") as file:
              repos = json.load(file)

          width = 1200
          card_width = 520
          card_height = 180
          gap_x = 40
          gap_y = 35
          left = 60
          top = 140

          rows = max(1, (len(repos) + 1) // 2)

          height = top + rows * card_height + (rows - 1) * gap_y + 70

          svg = f'''<svg width="{width}" height="{height}"
          viewBox="0 0 {width} {height}"
          xmlns="http://www.w3.org/2000/svg">

          <defs>

            <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#05020d"/>
              <stop offset="45%" stop-color="#130a29"/>
              <stop offset="100%" stop-color="#03030a"/>
            </linearGradient>

            <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#211337"/>
              <stop offset="55%" stop-color="#100b1f"/>
              <stop offset="100%" stop-color="#080711"/>
            </linearGradient>

            <linearGradient id="accent" x1="0" x2="1">
              <stop offset="0%" stop-color="#a855f7"/>
              <stop offset="50%" stop-color="#8b5cf6"/>
              <stop offset="100%" stop-color="#6366f1"/>
            </linearGradient>

            <filter id="blur">
              <feGaussianBlur stdDeviation="25"/>
            </filter>

            <filter id="softGlow">
              <feGaussianBlur stdDeviation="8"/>
            </filter>

          </defs>

          <!-- BACKGROUND -->

          <rect width="{width}"
                height="{height}"
                rx="32"
                fill="url(#bg)"/>

          <!-- AMBIENT LIGHT -->

          <circle cx="100"
                  cy="80"
                  r="180"
                  fill="#8b5cf6"
                  opacity=".14"
                  filter="url(#blur)">

            <animate attributeName="cx"
                     values="100;240;100"
                     dur="8s"
                     repeatCount="indefinite"/>

            <animate attributeName="cy"
                     values="80;150;80"
                     dur="9s"
                     repeatCount="indefinite"/>

          </circle>

          <circle cx="1080"
                  cy="{height - 80}"
                  r="190"
                  fill="#6366f1"
                  opacity=".13"
                  filter="url(#blur)">

            <animate attributeName="cx"
                     values="1080;980;1080"
                     dur="9s"
                     repeatCount="indefinite"/>

            <animate attributeName="cy"
                     values="{height - 80};{height - 150};{height - 80}"
                     dur="8s"
                     repeatCount="indefinite"/>

          </circle>

          <!-- TOP GRID -->

          <path d="M0 125 H1200"
                stroke="#a855f7"
                stroke-opacity=".08"/>

          <path d="M0 130 H1200"
                stroke="#a855f7"
                stroke-opacity=".03"/>

          <!-- HEADING -->

          <text x="600"
                y="62"
                text-anchor="middle"
                font-family="Arial, Helvetica, sans-serif"
                font-size="38"
                font-weight="700"
                fill="#ffffff">
            FEATURED WORK
          </text>

          <text x="600"
                y="95"
                text-anchor="middle"
                font-family="Arial, Helvetica, sans-serif"
                font-size="15"
                fill="#b8a8d9">
            Selected from my pinned repositories
          </text>

          <!-- PROJECTS -->
          '''

          if len(repos) == 0:

              svg += '''
              <text x="600"
                    y="220"
                    text-anchor="middle"
                    font-family="Arial, Helvetica, sans-serif"
                    font-size="18"
                    fill="#b8a8d9">
                No pinned repositories found.
              </text>
              '''

          for i, repo in enumerate(repos):

              col = i % 2
              row = i // 2

              x = left + col * (card_width + gap_x)
              y = top + row * (card_height + gap_y)

              name = html.escape(
                  repo.get("name") or "Repository"
              )

              description = html.escape(
                  repo.get("description")
                  or "A project built with curiosity and code."
              )

              if len(description) > 58:
                  description = description[:55] + "..."

              language = repo.get("primaryLanguage")

              if language:
                  language_name = html.escape(
                      language.get("name") or "Project"
                  )
              else:
                  language_name = "Project"

              stars = repo.get("stargazerCount", 0)
              forks = repo.get("forkCount", 0)

              svg += f'''

              <!-- PROJECT CARD -->

              <g>

                <!-- glow -->

                <rect x="{x + 2}"
                      y="{y + 3}"
                      width="{card_width - 4}"
                      height="{card_height - 4}"
                      rx="24"
                      fill="none"
                      stroke="#a855f7"
                      stroke-opacity=".12"
                      filter="url(#softGlow)"/>

                <!-- card -->

                <rect x="{x}"
                      y="{y}"
                      width="{card_width}"
                      height="{card_height}"
                      rx="24"
                      fill="url(#card)"
                      stroke="url(#accent)"
                      stroke-opacity=".45"/>

                <!-- inner border -->

                <rect x="{x + 1}"
                      y="{y + 1}"
                      width="{card_width - 2}"
                      height="{card_height - 2}"
                      rx="23"
                      fill="none"
                      stroke="#ffffff"
                      stroke-opacity=".05"/>

                <!-- icon -->

                <circle cx="{x + 48}"
                        cy="{y + 50}"
                        r="28"
                        fill="#8b5cf6"
                        opacity=".14"/>

                <circle cx="{x + 48}"
                        cy="{y + 50}"
                        r="20"
                        fill="none"
                        stroke="#c084fc"
                        stroke-opacity=".35"/>

                <text x="{x + 48}"
                      y="{y + 57}"
                      text-anchor="middle"
                      font-family="Arial, Helvetica, sans-serif"
                      font-size="18"
                      font-weight="700"
                      fill="#ffffff">
                  &lt;/&gt;
                </text>

                <!-- project name -->

                <text x="{x + 90}"
                      y="{y + 48}"
                      font-family="Arial, Helvetica, sans-serif"
                      font-size="21"
                      font-weight="700"
                      fill="#ffffff">
                  {name}
                </text>

                <!-- description -->

                <text x="{x + 90}"
                      y="{y + 78}"
                      font-family="Arial, Helvetica, sans-serif"
                      font-size="13"
                      fill="#aaa0c5">
                  {description}
                </text>

                <!-- language -->

                <rect x="{x + 90}"
                      y="{y + 96}"
                      width="105"
                      height="25"
                      rx="12"
                      fill="#8b5cf6"
                      opacity=".10"/>

                <text x="{x + 103}"
                      y="{y + 113}"
                      font-family="monospace"
                      font-size="11"
                      fill="#c084fc">
                  {language_name}
                </text>

                <!-- stats -->

                <text x="{x + 90}"
                      y="{y + 148}"
                      font-family="monospace"
                      font-size="12"
                      fill="#818cf8">
                  ★ {stars}    ⑂ {forks}
                </text>

                <!-- status -->

                <circle cx="{x + card_width - 28}"
                        cy="{y + 28}"
                        r="4"
                        fill="#a855f7">

                  <animate attributeName="opacity"
                           values=".3;1;.3"
                           dur="2s"
                           repeatCount="indefinite"/>

                </circle>

              </g>

              '''

          svg += f'''

          <!-- BORDER -->

          <rect x="2"
                y="2"
                width="{width - 4}"
                height="{height - 4}"
                rx="32"
                fill="none"
                stroke="#8b5cf6"
                stroke-opacity=".30"/>

          </svg>
          '''

          with open(
              "profile/featured-projects.svg",
              "w"
          ) as file:
              file.write(svg)

          print("Featured projects SVG generated successfully.")

          PY

      - name: Commit generated files
        uses: EndBug/add-and-commit@v9
        with:
          message: "Update featured projects"
          add: "profile/pinned-projects.json profile/featured-projects.svg"
