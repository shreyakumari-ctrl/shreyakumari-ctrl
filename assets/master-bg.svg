<svg width="1200" height="1600" viewBox="0 0 1200 1600"
xmlns="http://www.w3.org/2000/svg">

<defs>

  <!-- MASTER BACKGROUND -->
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#07000f"/>
    <stop offset="25%" stop-color="#0d0820"/>
    <stop offset="50%" stop-color="#090b1c"/>
    <stop offset="75%" stop-color="#100820"/>
    <stop offset="100%" stop-color="#03030a"/>
  </linearGradient>

  <!-- GRID -->
  <pattern id="grid"
           width="50"
           height="50"
           patternUnits="userSpaceOnUse">

    <path d="M50 0H0V50"
          fill="none"
          stroke="#8b5cf6"
          stroke-opacity=".055"
          stroke-width="1"/>

  </pattern>

  <!-- PURPLE GLOW -->
  <radialGradient id="purpleGlow">

    <stop offset="0%"
          stop-color="#a855f7"
          stop-opacity=".55"/>

    <stop offset="45%"
          stop-color="#6366f1"
          stop-opacity=".18"/>

    <stop offset="100%"
          stop-color="#000000"
          stop-opacity="0"/>

  </radialGradient>

  <!-- BLUE GLOW -->
  <radialGradient id="blueGlow">

    <stop offset="0%"
          stop-color="#6366f1"
          stop-opacity=".45"/>

    <stop offset="50%"
          stop-color="#4f46e5"
          stop-opacity=".14"/>

    <stop offset="100%"
          stop-color="#000000"
          stop-opacity="0"/>

  </radialGradient>

  <!-- PARTICLE -->
  <radialGradient id="particle">

    <stop offset="0%"
          stop-color="#ffffff"/>

    <stop offset="35%"
          stop-color="#d8b4fe"/>

    <stop offset="75%"
          stop-color="#a855f7"
          stop-opacity=".7"/>

    <stop offset="100%"
          stop-color="#a855f7"
          stop-opacity="0"/>

  </radialGradient>

  <!-- BLUR -->
  <filter id="blur">
    <feGaussianBlur stdDeviation="35"/>
  </filter>

  <filter id="softBlur">
    <feGaussianBlur stdDeviation="7"/>
  </filter>

</defs>


<!-- ================================================= -->
<!-- BACKGROUND -->
<!-- ================================================= -->

<rect width="1200"
      height="1600"
      fill="url(#bg)"/>


<!-- ================================================= -->
<!-- GRID -->
<!-- ================================================= -->

<rect width="1200"
      height="1600"
      fill="url(#grid)"/>


<!-- ================================================= -->
<!-- LARGE AMBIENT GLOWS -->
<!-- ================================================= -->

<circle cx="150"
        cy="150"
        r="280"
        fill="url(#purpleGlow)"
        filter="url(#blur)">

  <animate attributeName="cx"
           values="150;300;150"
           dur="14s"
           repeatCount="indefinite"/>

  <animate attributeName="cy"
           values="150;250;150"
           dur="12s"
           repeatCount="indefinite"/>

</circle>


<circle cx="1050"
        cy="520"
        r="300"
        fill="url(#blueGlow)"
        filter="url(#blur)">

  <animate attributeName="cx"
           values="1050;900;1050"
           dur="16s"
           repeatCount="indefinite"/>

  <animate attributeName="cy"
           values="520;430;520"
           dur="13s"
           repeatCount="indefinite"/>

</circle>


<circle cx="180"
        cy="1000"
        r="260"
        fill="url(#blueGlow)"
        filter="url(#blur)">

  <animate attributeName="cx"
           values="180;300;180"
           dur="15s"
           repeatCount="indefinite"/>

</circle>


<circle cx="1050"
        cy="1400"
        r="300"
        fill="url(#purpleGlow)"
        filter="url(#blur)">

  <animate attributeName="cx"
           values="1050;900;1050"
           dur="17s"
           repeatCount="indefinite"/>

</circle>


<!-- ================================================= -->
<!-- CONTINUOUS TOP → BOTTOM LIGHT STREAMS -->
<!-- ================================================= -->

<g opacity=".35">

  <rect x="100"
        y="-150"
        width="1.5"
        height="120"
        fill="#c084fc">

    <animate attributeName="y"
             values="-150;1700"
             dur="9s"
             repeatCount="indefinite"/>

  </rect>


  <rect x="260"
        y="-250"
        width="1"
        height="90"
        fill="#818cf8">

    <animate attributeName="y"
             values="-250;1700"
             dur="12s"
             begin="2s"
             repeatCount="indefinite"/>

  </rect>


  <rect x="430"
        y="-180"
        width="1.5"
        height="110"
        fill="#a855f7">

    <animate attributeName="y"
             values="-180;1700"
             dur="10s"
             begin="1s"
             repeatCount="indefinite"/>

  </rect>


  <rect x="620"
        y="-300"
        width="1"
        height="130"
        fill="#818cf8">

    <animate attributeName="y"
             values="-300;1700"
             dur="13s"
             begin="3s"
             repeatCount="indefinite"/>

  </rect>


  <rect x="800"
        y="-200"
        width="1.5"
        height="100"
        fill="#c084fc">

    <animate attributeName="y"
             values="-200;1700"
             dur="11s"
             begin="4s"
             repeatCount="indefinite"/>

  </rect>


  <rect x="1000"
        y="-280"
        width="1"
        height="120"
        fill="#6366f1">

    <animate attributeName="y"
             values="-280;1700"
             dur="14s"
             begin="1.5s"
             repeatCount="indefinite"/>

  </rect>


  <rect x="1140"
        y="-100"
        width="1.5"
        height="100"
        fill="#a855f7">

    <animate attributeName="y"
             values="-100;1700"
             dur="10s"
             begin="5s"
             repeatCount="indefinite"/>

  </rect>

</g>


<!-- ================================================= -->
<!-- FLOATING PARTICLES -->
<!-- ================================================= -->

<g>

  <circle cx="80" cy="40" r="3" fill="url(#particle)">
    <animate attributeName="cy"
             values="40;1650"
             dur="11s"
             repeatCount="indefinite"/>
  </circle>


  <circle cx="210" cy="300" r="2" fill="url(#particle)">
    <animate attributeName="cy"
             values="300;1650"
             dur="13s"
             begin="1s"
             repeatCount="indefinite"/>
  </circle>


  <circle cx="340" cy="150" r="3" fill="url(#particle)">
    <animate attributeName="cy"
             values="150;1650"
             dur="10s"
             begin="3s"
             repeatCount="indefinite"/>
  </circle>


  <circle cx="510" cy="500" r="2.5" fill="url(#particle)">
    <animate attributeName="cy"
             values="500;1650"
             dur="12s"
             begin="2s"
             repeatCount="indefinite"/>
  </circle>


  <circle cx="690" cy="80" r="3" fill="url(#particle)">
    <animate attributeName="cy"
             values="80;1650"
             dur="11s"
             begin="4s"
             repeatCount="indefinite"/>
  </circle>


  <circle cx="840" cy="350" r="2" fill="url(#particle)">
    <animate attributeName="cy"
             values="350;1650"
             dur="14s"
             begin="1s"
             repeatCount="indefinite"/>
  </circle>


  <circle cx="980" cy="180" r="3" fill="url(#particle)">
    <animate attributeName="cy"
             values="180;1650"
             dur="10s"
             begin="5s"
             repeatCount="indefinite"/>
  </circle>


  <circle cx="1120" cy="600" r="2.5" fill="url(#particle)">
    <animate attributeName="cy"
             values="600;1650"
             dur="13s"
             begin="2.5s"
             repeatCount="indefinite"/>
  </circle>

</g>


<!-- ================================================= -->
<!-- HORIZONTAL ENERGY LINES -->
<!-- ================================================= -->

<g opacity=".25">

  <line x1="0"
        y1="400"
        x2="1200"
        y2="400"
        stroke="#8b5cf6"/>

  <line x1="0"
        y1="800"
        x2="1200"
        y2="800"
        stroke="#8b5cf6"/>

  <line x1="0"
        y1="1200"
        x2="1200"
        y2="1200"
        stroke="#8b5cf6"/>

</g>


<!-- MOVING ENERGY BEAMS -->

<g>

  <line x1="-300"
        y1="400"
        x2="-50"
        y2="400"
        stroke="#c084fc"
        stroke-width="2"
        filter="url(#softBlur)">

    <animate attributeName="x1"
             values="-300;1200"
             dur="7s"
             repeatCount="indefinite"/>

    <animate attributeName="x2"
             values="-50;1450"
             dur="7s"
             repeatCount="indefinite"/>

  </line>


  <line x1="1200"
        y1="800"
        x2="1450"
        y2="800"
        stroke="#818cf8"
        stroke-width="2"
        filter="url(#softBlur)">

    <animate attributeName="x1"
             values="1200;-300"
             dur="8s"
             repeatCount="indefinite"/>

    <animate attributeName="x2"
             values="1450;-50"
             dur="8s"
             repeatCount="indefinite"/>

  </line>


  <line x1="-300"
        y1="1200"
        x2="-50"
        y2="1200"
        stroke="#a855f7"
        stroke-width="2"
        filter="url(#softBlur)">

    <animate attributeName="x1"
             values="-300;1200"
             dur="9s"
             repeatCount="indefinite"/>

    <animate attributeName="x2"
             values="-50;1450"
             dur="9s"
             repeatCount="indefinite"/>

  </line>

</g>


<!-- ================================================= -->
<!-- CENTRAL VERTICAL ENERGY -->
<!-- ================================================= -->

<line x1="600"
      y1="0"
      x2="600"
      y2="1600"
      stroke="#8b5cf6"
      stroke-opacity=".035"/>


<!-- ================================================= -->
<!-- SECTION CONNECTOR NODES -->
<!-- ================================================= -->

<g fill="#a855f7">

  <circle cx="600" cy="400" r="3">
    <animate attributeName="r"
             values="2;6;2"
             dur="3s"
             repeatCount="indefinite"/>
  </circle>

  <circle cx="600" cy="800" r="3">
    <animate attributeName="r"
             values="2;6;2"
             dur="3s"
             begin="1s"
             repeatCount="indefinite"/>
  </circle>

  <circle cx="600" cy="1200" r="3">
    <animate attributeName="r"
             values="2;6;2"
             dur="3s"
             begin="2s"
             repeatCount="indefinite"/>
  </circle>

</g>


<!-- ================================================= -->
<!-- OUTER BORDER -->
<!-- ================================================= -->

<rect x="3"
      y="3"
      width="1194"
      height="1594"
      rx="35"
      fill="none"
      stroke="#8b5cf6"
      stroke-opacity=".18"/>

</svg>
