<svg width="1200" height="650" viewBox="0 0 1200 650"
xmlns="http://www.w3.org/2000/svg">

<defs>

  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#07000f"/>
    <stop offset="50%" stop-color="#120a2b"/>
    <stop offset="100%" stop-color="#03030a"/>
  </linearGradient>

  <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#24153f"/>
    <stop offset="100%" stop-color="#0d0b19"/>
  </linearGradient>

  <linearGradient id="purple" x1="0" x2="1">
    <stop offset="0%" stop-color="#a855f7"/>
    <stop offset="100%" stop-color="#6366f1"/>
  </linearGradient>

  <filter id="glow">
    <feGaussianBlur stdDeviation="18"/>
  </filter>

</defs>

<!-- Background -->
<rect width="1200" height="650" rx="32" fill="url(#bg)"/>

<!-- Ambient glows -->
<circle cx="120" cy="100" r="150"
        fill="#8b5cf6"
        opacity=".18"
        filter="url(#glow)">
  <animate attributeName="cx"
           values="120;220;120"
           dur="7s"
           repeatCount="indefinite"/>
</circle>

<circle cx="1080" cy="540" r="170"
        fill="#6366f1"
        opacity=".15"
        filter="url(#glow)">
  <animate attributeName="cy"
           values="540;460;540"
           dur="8s"
           repeatCount="indefinite"/>
</circle>

<!-- Heading -->
<text x="600" y="75"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="38"
      font-weight="700"
      fill="#ffffff">
  FEATURED WORK
</text>

<text x="600" y="108"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="15"
      fill="#b8a8d9">
  Things I've built with curiosity and code
</text>


<!-- CARD 1 -->
<g>

<rect x="70" y="155"
      width="500"
      height="190"
      rx="24"
      fill="url(#card)"
      stroke="#a855f7"
      stroke-opacity=".45"/>

<rect x="70" y="155"
      width="500"
      height="190"
      rx="24"
      fill="none"
      stroke="#c084fc"
      stroke-opacity=".12"
      stroke-width="6"/>

<circle cx="120" cy="210" r="28"
        fill="#a855f7"
        opacity=".2"/>

<text x="120" y="219"
      text-anchor="middle"
      font-size="25"
      fill="#ffffff">
  AI
</text>

<text x="165" y="205"
      font-family="Arial"
      font-size="23"
      font-weight="700"
      fill="#ffffff">
  GestureScribe AI
</text>

<text x="165" y="235"
      font-family="Arial"
      font-size="14"
      fill="#aaa0c5">
  Hand gesture based dictation
</text>

<text x="165" y="265"
      font-family="monospace"
      font-size="13"
      fill="#c084fc">
  React • Python • MediaPipe
</text>

<text x="165" y="305"
      font-family="Arial"
      font-size="13"
      fill="#818cf8">
  COMPUTER VISION
</text>

</g>


