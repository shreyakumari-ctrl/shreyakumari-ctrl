<svg width="1200" height="650" viewBox="0 0 1200 650"
xmlns="http://www.w3.org/2000/svg">

<defs>

  <!-- BACKGROUND -->
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#07000f"/>
    <stop offset="45%" stop-color="#120a2b"/>
    <stop offset="75%" stop-color="#0b1024"/>
    <stop offset="100%" stop-color="#03030a"/>
  </linearGradient>

  <!-- CARD -->
  <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#24153f"/>
    <stop offset="55%" stop-color="#120d24"/>
    <stop offset="100%" stop-color="#080812"/>
  </linearGradient>

  <!-- CARD HIGHLIGHT -->
  <linearGradient id="purple" x1="0" x2="1">
    <stop offset="0%" stop-color="#c084fc"/>
    <stop offset="50%" stop-color="#a855f7"/>
    <stop offset="100%" stop-color="#6366f1"/>
  </linearGradient>

  <!-- GRID -->
  <pattern id="grid"
           width="45"
           height="45"
           patternUnits="userSpaceOnUse">
    <path d="M45 0H0V45"
          fill="none"
          stroke="#8b5cf6"
          stroke-opacity=".07"/>
  </pattern>

  <!-- GLOW -->
  <filter id="glow">
    <feGaussianBlur stdDeviation="18"/>
  </filter>

  <filter id="softGlow">
    <feGaussianBlur stdDeviation="5"/>
  </filter>

  <!-- PARTICLE -->
  <radialGradient id="particle">
    <stop offset="0%" stop-color="#ffffff"/>
    <stop offset="40%" stop-color="#c084fc"/>
    <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
  </radialGradient>

</defs>


<!-- BACKGROUND -->

<rect width="1200"
      height="650"
      rx="32"
      fill="url(#bg)"/>


<!-- FUTURISTIC GRID -->

<rect width="1200"
      height="650"
      rx="32"
      fill="url(#grid)"/>


<!-- AMBIENT GLOW LEFT -->

<circle cx="120"
        cy="100"
        r="170"
        fill="#8b5cf6"
        opacity=".16"
        filter="url(#glow)">

  <animate attributeName="cx"
           values="120;230;120"
           dur="8s"
           repeatCount="indefinite"/>

  <animate attributeName="cy"
           values="100;160;100"
           dur="7s"
           repeatCount="indefinite"/>

</circle>


<!-- AMBIENT GLOW RIGHT -->

<circle cx="1080"
        cy="540"
        r="190"
        fill="#6366f1"
        opacity=".14"
        filter="url(#glow)">

  <animate attributeName="cx"
           values="1080;980;1080"
           dur="9s"
           repeatCount="indefinite"/>

  <animate attributeName="cy"
           values="540;470;540"
           dur="8s"
           repeatCount="indefinite"/>

</circle>


<!-- TOP → BOTTOM LIGHT STREAMS -->

<g opacity=".35">

  <rect x="150"
        y="-100"
        width="1.5"
        height="90"
        fill="#c084fc">

    <animate attributeName="y"
             values="-100;700"
             dur="7s"
             repeatCount="indefinite"/>

  </rect>


  <rect x="400"
        y="-120"
        width="1"
        height="100"
        fill="#818cf8">

    <animate attributeName="y"
             values="-120;700"
             dur="8s"
             begin="1s"
             repeatCount="indefinite"/>

  </rect>


  <rect x="720"
        y="-80"
        width="1.5"
        height="100"
        fill="#a855f7">

    <animate attributeName="y"
             values="-80;700"
             dur="6.5s"
             begin="2s"
             repeatCount="indefinite"/>

  </rect>


  <rect x="1030"
        y="-120"
        width="1"
        height="90"
        fill="#6366f1">

    <animate attributeName="y"
             values="-120;700"
             dur="8.5s"
             begin="3s"
             repeatCount="indefinite"/>

  </rect>

</g>


<!-- FLOATING PARTICLES -->

<g>

  <circle cx="90" cy="30" r="3" fill="url(#particle)">
    <animate attributeName="cy"
             values="30;680"
             dur="7s"
             repeatCount="indefinite"/>
  </circle>

  <circle cx="300" cy="120" r="2.5" fill="url(#particle)">
    <animate attributeName="cy"
             values="120;680"
             dur="8s"
             begin="1s"
             repeatCount="indefinite"/>
  </circle>

  <circle cx="560" cy="20" r="3" fill="url(#particle)">
    <animate attributeName="cy"
             values="20;680"
             dur="6s"
             begin="2s"
             repeatCount="indefinite"/>
  </circle>

  <circle cx="850" cy="100" r="2.5" fill="url(#particle)">
    <animate attributeName="cy"
             values="100;680"
             dur="7.5s"
             begin=".5s"
             repeatCount="indefinite"/>
  </circle>

  <circle cx="1120" cy="50" r="3" fill="url(#particle)">
    <animate attributeName="cy"
             values="50;680"
             dur="6.5s"
             begin="3s"
             repeatCount="indefinite"/>
  </circle>

</g>


<!-- HEADING -->

<text x="600"
      y="75"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="38"
      font-weight="700"
      letter-spacing="1"
      fill="#ffffff">

  FEATURED WORK

</text>


<text x="600"
      y="108"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="15"
      fill="#b8a8d9">

