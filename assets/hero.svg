<svg width="1200" height="400" viewBox="0 0 1200 400"
     xmlns="http://www.w3.org/2000/svg">

<defs>

  <!-- MAIN BACKGROUND -->
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#07000f"/>
    <stop offset="45%" stop-color="#120a28"/>
    <stop offset="75%" stop-color="#0b1024"/>
    <stop offset="100%" stop-color="#03030a"/>
  </linearGradient>

  <!-- PURPLE / BLUE GLOW -->
  <radialGradient id="glow">
    <stop offset="0%" stop-color="#a855f7" stop-opacity=".75"/>
    <stop offset="45%" stop-color="#6366f1" stop-opacity=".28"/>
    <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
  </radialGradient>

  <!-- TEXT -->
  <linearGradient id="text" x1="0" x2="1">
    <stop offset="0%" stop-color="#e9d5ff"/>
    <stop offset="45%" stop-color="#ffffff"/>
    <stop offset="100%" stop-color="#818cf8"/>
  </linearGradient>

  <!-- GRID -->
  <pattern id="grid"
           width="45"
           height="45"
           patternUnits="userSpaceOnUse">
    <path d="M45 0H0V45"
          fill="none"
          stroke="#8b5cf6"
          stroke-opacity=".08"
          stroke-width="1"/>
  </pattern>

  <!-- BLUR -->
  <filter id="blur">
    <feGaussianBlur stdDeviation="24"/>
  </filter>

  <filter id="softGlow">
    <feGaussianBlur stdDeviation="5"/>
  </filter>

  <!-- PARTICLE -->
  <radialGradient id="particle">
    <stop offset="0%" stop-color="#ffffff"/>
    <stop offset="40%" stop-color="#c084fc"/>
    <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
  </radialGradient>

</defs>


<!-- BACKGROUND -->

<rect width="1200"
      height="400"
      rx="30"
      fill="url(#bg)"/>


<!-- FUTURISTIC GRID -->

<rect width="1200"
      height="400"
      rx="30"
      fill="url(#grid)"/>


<!-- AMBIENT LIGHT -->

<circle cx="230"
        cy="80"
        r="190"
        fill="url(#glow)"
        filter="url(#blur)">

  <animate attributeName="cx"
           values="230;330;230"
           dur="8s"
           repeatCount="indefinite"/>

  <animate attributeName="cy"
           values="80;140;80"
           dur="7s"
           repeatCount="indefinite"/>

</circle>


<circle cx="950"
        cy="300"
        r="210"
        fill="url(#glow)"
        filter="url(#blur)">

  <animate attributeName="cx"
           values="950;880;950"
           dur="9s"
           repeatCount="indefinite"/>

  <animate attributeName="cy"
           values="300;240;300"
           dur="8s"
           repeatCount="indefinite"/>

</circle>


<!-- TOP → BOTTOM LIGHT STREAMS -->

<g opacity=".45">

  <rect x="180" y="-80"
        width="1.5"
        height="80"
        rx="2"
        fill="#c084fc">

    <animate attributeName="y"
             values="-80;450"
             dur="5s"
             repeatCount="indefinite"/>

  </rect>


  <rect x="420" y="-100"
        width="1"
        height="100"
        fill="#818cf8">

    <animate attributeName="y"
             values="-100;450"
             dur="7s"
             begin="1s"
             repeatCount="indefinite"/>

  </rect>


  <rect x="650" y="-120"
        width="1.5"
        height="100"
        fill="#a855f7">

    <animate attributeName="y"
             values="-120;450"
             dur="6s"
             begin="2s"
             repeatCount="indefinite"/>

  </rect>


  <rect x="1080" y="-100"
        width="1"
        height="90"
        fill="#6366f1">

    <animate attributeName="y"
             values="-100;450"
             dur="8s"
             begin="3s"
             repeatCount="indefinite"/>

  </rect>

</g>


<!-- FLOATING PARTICLES -->

<g>

  <circle cx="120" cy="30" r="3" fill="url(#particle)">
    <animate attributeName="cy"
             values="30;420"
             dur="6s"
             repeatCount="indefinite"/>
  </circle>

  <circle cx="360" cy="100" r="2.5" fill="url(#particle)">
    <animate attributeName="cy"
             values="100;420"
             dur="7s"
             begin="1s"
             repeatCount="indefinite"/>
  </circle>

  <circle cx="560" cy="20" r="3" fill="url(#particle)">
    <animate attributeName="cy"
             values="20;420"
             dur="5.5s"
             begin="2s"
             repeatCount="indefinite"/>
  </circle>

  <circle cx="760" cy="130" r="2" fill="url(#particle)">
    <animate attributeName="cy"
             values="130;420"
             dur="8s"
             begin="1.5s"
             repeatCount="indefinite"/>
  </circle>

  <circle cx="1030" cy="60" r="3" fill="url(#particle)">
    <animate attributeName="cy"
             values="60;420"
             dur="6.5s"
             begin=".5s"
             repeatCount="indefinite"/>
  </circle>

</g>


<!-- HORIZONTAL LIGHT LINE -->

<line x1="40"
      y1="350"
      x2="1160"
      y2="350"
      stroke="#8b5cf6"
      stroke-opacity=".15"/>

<line x1="40"
      y1="350"
      x2="250"
      y2="350"
      stroke="#c084fc"
      stroke-width="2"
      opacity=".6">

  <animate attributeName="x1"
           values="-250;1160"
           dur="6s"
           repeatCount="indefinite"/>

  <animate attributeName="x2"
           values="-50;1400"
           dur="6s"
           repeatCount="indefinite"/>

</line>


<!-- 3D ORBITAL SYSTEM -->

<g transform="translate(950 200)"
   fill="none"
   stroke="#a855f7">

  <ellipse rx="145"
           ry="55"
           stroke-width="2"
           opacity=".65">

    <animateTransform
      attributeName="transform"
      type="rotate"
      from="0"
      to="360"
      dur="8s"
      repeatCount="indefinite"/>

  </ellipse>


  <ellipse rx="110"
           ry="110"
           stroke-width="2"
           opacity=".5">

    <animateTransform
      attributeName="transform"
      type="rotate"
      from="360"
      to="0"
      dur="6s"
      repeatCount="indefinite"/>

  </ellipse>


  <ellipse rx="75"
           ry="145"
           stroke-width="1.5"
           opacity=".45">

    <animateTransform
      attributeName="transform"
      type="rotate"
      from="0"
      to="360"
      dur="10s"
      repeatCount="indefinite"/>

  </ellipse>

</g>


<!-- ORBITAL CORE -->

<circle cx="950"
        cy="200"
        r="28"
        fill="#a855f7"
        opacity=".9">

  <animate attributeName="r"
           values="25;34;25"
           dur="2s"
           repeatCount="indefinite"/>

</circle>


<circle cx="950"
        cy="200"
        r="55"
        fill="none"
        stroke="#c084fc"
        opacity=".35">

  <animate attributeName="r"
           values="45;70;45"
           dur="3s"
           repeatCount="indefinite"/>

</circle>


<!-- CORE LIGHT -->

<circle cx="950"
        cy="200"
        r="10"
        fill="#ffffff"
        opacity=".8">

  <animate attributeName="opacity"
           values=".5;1;.5"
           dur="1.5s"
           repeatCount="indefinite"/>

</circle>


<!-- MAIN TEXT -->

<text x="90"
      y="150"
      font-family="Arial, Helvetica, sans-serif"
      font-size="58"
      font-weight="700"
      letter-spacing="1"
      fill="url(#text)">

  SHREYA KUMARI

</text>


<text x="95"
      y="200"
      font-family="Arial, Helvetica, sans-serif"
      font-size="23"
      font-weight="600"
      fill="#d8b4fe">

  FRONTEND DEVELOPER

</text>


<text x="95"
      y="245"
      font-family="Arial, Helvetica, sans-serif"
      font-size="16"
      fill="#a1a1aa">

  Building modern digital experiences

</text>


<!-- TECH LABELS -->

<g font-family="monospace"
   font-size="15">

  <text x="95"
        y="310"
        fill="#818cf8">

    React

  </text>

  <text x="165"
        y="310"
        fill="#c084fc">

    JavaScript

  </text>

  <text x="285"
        y="310"
        fill="#818cf8">

    AI

  </text>

  <text x="325"
        y="310"
        fill="#c084fc">

    Creative Tech

  </text>

</g>


<!-- BORDER -->

<rect x="2"
      y="2"
      width="1196"
      height="396"
      rx="30"
      fill="none"
      stroke="#8b5cf6"
      stroke-opacity=".4"/>

</svg>
