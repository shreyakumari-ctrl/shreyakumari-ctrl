<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#090014"/>
    <stop offset="50%" stop-color="#17102f"/>
    <stop offset="100%" stop-color="#05050d"/>
  </linearGradient>

  <radialGradient id="glow">
    <stop offset="0%" stop-color="#a855f7" stop-opacity="0.8"/>
    <stop offset="50%" stop-color="#6366f1" stop-opacity="0.3"/>
    <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
  </radialGradient>

  <linearGradient id="text" x1="0" x2="1">
    <stop offset="0%" stop-color="#c084fc"/>
    <stop offset="50%" stop-color="#ffffff"/>
    <stop offset="100%" stop-color="#818cf8"/>
  </linearGradient>

  <filter id="blur">
    <feGaussianBlur stdDeviation="25"/>
  </filter>
</defs>

<!-- Background -->
<rect width="1200" height="400" rx="30" fill="url(#bg)"/>

<!-- Ambient glow -->
<circle cx="250" cy="100" r="180" fill="url(#glow)" filter="url(#blur)">
  <animate attributeName="cx"
           values="250;350;250"
           dur="6s"
           repeatCount="indefinite"/>
</circle>

<circle cx="950" cy="300" r="180" fill="url(#glow)" filter="url(#blur)">
  <animate attributeName="cy"
           values="300;220;300"
           dur="7s"
           repeatCount="indefinite"/>
</circle>

<!-- 3D rings -->
<g transform="translate(950 200)" fill="none" stroke="#a855f7" opacity="0.65">

  <ellipse rx="145" ry="55" stroke-width="2">
    <animateTransform
      attributeName="transform"
      type="rotate"
      from="0"
      to="360"
      dur="8s"
      repeatCount="indefinite"/>
  </ellipse>

  <ellipse rx="110" ry="110" stroke-width="2">
    <animateTransform
      attributeName="transform"
      type="rotate"
      from="360"
      to="0"
      dur="6s"
      repeatCount="indefinite"/>
  </ellipse>

  <ellipse rx="75" ry="145" stroke-width="1.5">
    <animateTransform
      attributeName="transform"
      type="rotate"
      from="0"
      to="360"
      dur="10s"
      repeatCount="indefinite"/>
  </ellipse>

</g>

<!-- Center core -->
<circle cx="950" cy="200" r="28" fill="#a855f7" opacity="0.9">
  <animate attributeName="r"
           values="25;34;25"
           dur="2s"
           repeatCount="indefinite"/>
</circle>

<circle cx="950" cy="200" r="55"
        fill="none"
        stroke="#c084fc"
        opacity="0.35">
  <animate attributeName="r"
           values="45;70;45"
           dur="3s"
           repeatCount="indefinite"/>
</circle>

<!-- Main text -->
<text x="90" y="150"
      font-family="Arial, Helvetica, sans-serif"
      font-size="58"
      font-weight="700"
      fill="url(#text)">
  SHREYA KUMARI
</text>

<text x="95" y="200"
      font-family="Arial, Helvetica, sans-serif"
      font-size="23"
      fill="#d8b4fe">
  FRONTEND DEVELOPER
</text>

<text x="95" y="245"
      font-family="Arial, Helvetica, sans-serif"
      font-size="16"
      fill="#a1a1aa">
  Building modern digital experiences
</text>

<!-- Tech labels -->
<text x="95" y="310"
      font-family="monospace"
      font-size="15"
      fill="#818cf8">
  React
</text>

<text x="165" y="310"
      font-family="monospace"
      font-size="15"
      fill="#c084fc">
  JavaScript
</text>

<text x="285" y="310"
      font-family="monospace"
      font-size="15"
      fill="#818cf8">
  AI
</text>

<text x="325" y="310"
      font-family="monospace"
      font-size="15"
      fill="#c084fc">
  Creative Tech
</text>

<!-- border -->
<rect x="2" y="2"
      width="1196"
      height="396"
      rx="30"
      fill="none"
      stroke="#7c3aed"
      stroke-opacity="0.35"/>

</svg>
