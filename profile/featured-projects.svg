<svg width="1200" height="390" viewBox="0 0 1200 390" xmlns="http://www.w3.org/2000/svg">

<defs>

  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#07000f"/>
    <stop offset="50%" stop-color="#120a2b"/>
    <stop offset="100%" stop-color="#03030a"/>
  </linearGradient>

  <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#24153f"/>
    <stop offset="100%" stop-color="#0d0b19"/>
  </linearGradient>

  <linearGradient id="text" x1="0" x2="1">
    <stop offset="0%" stop-color="#c084fc"/>
    <stop offset="100%" stop-color="#818cf8"/>
  </linearGradient>

  <filter id="glow">
    <feGaussianBlur stdDeviation="18"/>
  </filter>

</defs>

<rect width="1200" height="390" rx="32" fill="url(#bg)"/>

<circle cx="120" cy="80" r="150"
        fill="#8b5cf6"
        opacity=".15"
        filter="url(#glow)">
  <animate attributeName="cx"
           values="120;220;120"
           dur="7s"
           repeatCount="indefinite"/>
</circle>

<circle cx="1080" cy="310" r="170"
        fill="#6366f1"
        opacity=".12"
        filter="url(#glow)">
  <animate attributeName="cy"
           values="310;240;310"
           dur="8s"
           repeatCount="indefinite"/>
</circle>

<text x="600" y="62"
      text-anchor="middle"
      font-family="Arial, Helvetica, sans-serif"
      font-size="38"
      font-weight="700"
      fill="#ffffff">
  FEATURED WORK
</text>

<text x="600" y="95"
      text-anchor="middle"
      font-family="Arial, Helvetica, sans-serif"
      font-size="15"
      fill="#b8a8d9">
  My pinned repositories
</text>


<rect x="2"
      y="2"
      width="1196"
      height="386"
      rx="32"
      fill="none"
      stroke="#8b5cf6"
      stroke-opacity=".30"/>

</svg>
