<svg width="1200" height="820"
viewBox="0 0 1200 820"
xmlns="http://www.w3.org/2000/svg">

<defs>

  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#05020d"/>
    <stop offset="45%" stop-color="#130a29"/>
    <stop offset="100%" stop-color="#03030a"/>
  </linearGradient>

  <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#211337"/>
    <stop offset="55%" stop-color="#100b1f"/>
    <stop offset="100%" stop-color="#080711"/>
  </linearGradient>

  <linearGradient id="accent" x1="0" x2="1">
    <stop offset="0%" stop-color="#a855f7"/>
    <stop offset="50%" stop-color="#8b5cf6"/>
    <stop offset="100%" stop-color="#6366f1"/>
  </linearGradient>

  <filter id="blur">
    <feGaussianBlur stdDeviation="25"/>
  </filter>

  <filter id="softGlow">
    <feGaussianBlur stdDeviation="8"/>
  </filter>

</defs>

<!-- BACKGROUND -->

<rect width="1200"
      height="820"
      rx="32"
      fill="url(#bg)"/>

<!-- AMBIENT LIGHT -->

<circle cx="100"
        cy="80"
        r="180"
        fill="#8b5cf6"
        opacity=".14"
        filter="url(#blur)">

  <animate attributeName="cx"
           values="100;240;100"
           dur="8s"
           repeatCount="indefinite"/>

  <animate attributeName="cy"
           values="80;150;80"
           dur="9s"
           repeatCount="indefinite"/>

</circle>

<circle cx="1080"
        cy="740"
        r="190"
        fill="#6366f1"
        opacity=".13"
        filter="url(#blur)">

  <animate attributeName="cx"
           values="1080;980;1080"
           dur="9s"
           repeatCount="indefinite"/>

  <animate attributeName="cy"
